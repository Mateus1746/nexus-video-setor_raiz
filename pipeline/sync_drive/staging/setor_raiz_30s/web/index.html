<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Setor Raiz</title>
  <style>
    body { margin: 0; background-color: black; overflow: hidden; }
    #video-canvas { width: 1080px; height: 1920px; }
  </style>
</head>
<body>
  <canvas id="video-canvas" width="1080" height="1920"></canvas>
  <script>
    const canvas = document.getElementById('video-canvas');
    const ctx = canvas.getContext('2d');

    window.renderFrame = function(frameIndex, totalFrames) {
      // Background
      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Cyberpunk Grid
      ctx.strokeStyle = '#00FF00';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for(let x = 0; x <= canvas.width; x += 50) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
      }
      for(let y = 0; y <= canvas.height; y += 50) {
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
      }
      ctx.stroke();

      // Matrix rain text
      ctx.fillStyle = '#00FF00';
      ctx.font = '30px monospace';
      const lines = [
        "Atenção agentes livres.",
        "O sistema Matrix tem tentado",
        "esconder a verdade sobre",
        "a economia do GTA 6.",
        "Nós interceptamos os dados:",
        "549 reais não é apenas um número,",
        "é um imposto oculto.",
        "Mas temos a solução na rede.",
        "Junte-se ao Setor Raiz.",
        "Link seguro garantido nos logs."
      ];

      let yOffset = canvas.height / 2 - (lines.length * 40) / 2;
      lines.forEach((line, i) => {
         // reveal text progressively based on frameIndex
         const revealFactor = Math.min(1, Math.max(0, (frameIndex - i*10) / 50));
         const text = line.substring(0, Math.floor(revealFactor * line.length));
         ctx.fillText(text, 100, yOffset + i * 40);
      });

      // Data logs (Matrix matrix)
      ctx.fillStyle = 'rgba(0, 255, 0, 0.5)';
      ctx.font = '15px monospace';
      for(let i=0; i<20; i++) {
        ctx.fillText(Math.random().toString(16).substring(2), 10, 30 + i * 20);
        ctx.fillText(Math.random().toString(16).substring(2), canvas.width - 150, 30 + i * 20);
      }
    };
  </script>
</body>
</html>
